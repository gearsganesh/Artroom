name: Artroom web build

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/web-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Artroom web frontend
        working-directory: frontend
        run: npm run build --workspace=artcraft
      - name: Verify static output
        run: test -s frontend/apps/artcraft/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: artroom-web-dist
          path: frontend/apps/artcraft/dist/
          if-no-files-found: error
          retention-days: 7
